logLevel: info
logDestinations: [stdout]
logStructured: true

authMethod: internal
authInternalUsers:
  - user: any
    ips: [127.0.0.1, '::1']
    permissions:
      - action: publish
        path: live
      - action: api
  - user: any
    ips: [127.0.0.1, '::1', 192.168.1.0/24, 172.16.3.0/24]
    permissions:
      - action: read
        path: live

api: true
apiAddress: 127.0.0.1:9997
metrics: false
pprof: false
playback: false
rtsp: false
rtmp: false
hls: false
srt: false
moq: false

webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ['http://192.168.1.6:8889', 'http://127.0.0.1:8889', 'http://localhost:8889', 'http://172.16.3.2:8889']
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [192.168.1.6, 127.0.0.1, 172.16.3.2]
webrtcICEServers2: []

paths:
  live:
    source: publisher
    overridePublisher: false
